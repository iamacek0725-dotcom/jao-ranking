*{box-sizing:border-box}
html,body{height:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(108px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------- header ---------- */
.hd{display:flex;align-items:center;gap:12px;padding-block:6px 14px}
.logo{flex:none;width:72px;height:64px;border-radius:14px;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;overflow:hidden}
.logo img{width:66px;height:auto;display:block}
.hd h1{margin:0;font-family:var(--f-disp);font-weight:900;font-size:clamp(1.25rem,6vw,1.55rem);white-space:nowrap;line-height:1.15;letter-spacing:.02em;text-wrap:balance}
.hd h1 em{font-style:normal;color:var(--red)}
.hd .meta{margin-top:4px;font-size:.88rem;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 10px}
.period{display:inline-block;font-family:var(--f-hand);font-size:.9rem;color:var(--red-ink);margin-bottom:2px}

.hd>div:nth-child(2){flex:1;min-width:0}
.reload{flex:none;align-self:center;display:flex;flex-direction:column;align-items:center;gap:0;background:var(--face);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;font-size:1.2rem;line-height:1;cursor:pointer;color:var(--red)}
.reload span{font-family:var(--f-disp);font-weight:700;font-size:.78rem;color:var(--ink-2);margin-top:3px}
.reload[aria-busy="true"]{opacity:.5}
/* ---------- tile (card) ---------- */
.tile{background:var(--face);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 5px 0 -1.5px var(--red),0 5px 0 0 var(--line);padding:16px}
.tile+.tile,.stack>*+*{margin-top:18px}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px}
.sec-t h2{margin:0;font-family:var(--f-disp);font-weight:700;font-size:1.2rem}
.sec-t small{color:var(--ink-2);font-size:.88rem}

/* ---------- player picker ---------- */
.picker{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.picker label{font-family:var(--f-disp);font-weight:700;font-size:1rem;color:var(--ink-2);flex:none}
.sel{position:relative;flex:1;min-width:0}
.sel select{width:100%;appearance:none;-webkit-appearance:none;background:var(--face);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 40px 10px 14px;font-family:var(--f-disp);font-weight:700;font-size:1.15rem}
.sel::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2.5px solid var(--red);border-bottom:2.5px solid var(--red);transform:translateY(-70%) rotate(45deg);pointer-events:none}

/* ---------- my stats ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.hero .lbl{font-size:.95rem;color:var(--ink-2);font-weight:700;letter-spacing:.06em}
.hero .big{font-family:var(--f-num);font-weight:700;font-size:2.7rem;line-height:1;letter-spacing:-.04em}
.hero .rank{text-align:right}
.rankchip{display:inline-flex;align-items:baseline;gap:2px;font-family:var(--f-disp);font-weight:900;color:var(--red-ink)}
.rankchip b{font-family:var(--f-num);font-size:2rem;line-height:1}
.hero .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.95rem;color:var(--ink-2);margin-top:6px}
.delta{font-family:var(--f-num);font-weight:700}
.up{color:var(--ok)} .down{color:var(--red-ink)}
.spark{margin-top:12px;width:100%;height:auto;display:block}
.spark text{font-family:var(--f-num);font-size:11px;fill:var(--ink-2)}

.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--face);border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 10px;box-shadow:0 4px 0 -1.5px var(--red),0 4px 0 0 var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat h3{margin:0;font-family:var(--f-disp);font-weight:700;font-size:.98rem;color:var(--ink-2)}
.stat .v{font-family:var(--f-num);font-weight:700;font-size:1.55rem;line-height:1.2;letter-spacing:-.03em}
.stat .v small{font-family:var(--f-body);font-size:.9rem;font-weight:500;color:var(--ink-2);margin-left:2px}
.stat .rk{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:3px;font-size:.85rem;font-weight:700;border-radius:999px;padding:1px 8px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.pill.aw{background:var(--red-soft);border-color:transparent;color:var(--red-ink)}
.pill.top{background:var(--red);color:#fff;border-color:transparent}
.stat .pv{font-size:.85rem;color:var(--ink-2)}

/* place distribution — four tiles */
.places{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pl{text-align:center}
.pl .t{margin:0 auto;width:100%;max-width:64px;aspect-ratio:3/4;border:1.5px solid var(--line);border-radius:10px;background:var(--face);box-shadow:0 4px 0 -1.5px var(--red),0 4px 0 0 var(--line);display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:1.25rem}
.pl:nth-child(1) .t{color:var(--red)}
.pl .c{font-family:var(--f-num);font-weight:700;font-size:1.15rem;margin-top:10px}
.pl .r{font-size:.82rem;color:var(--ink-2);line-height:1.4}
.pbar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-top:14px;border:1.5px solid var(--line)}
.pbar span{display:block;height:100%}

/* eligibility */
.elig{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.eg{border:1.5px dashed var(--rule);border-radius:12px;padding:8px 6px;text-align:center}
.eg.future{opacity:.55}
.eg.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.eg .k{font-size:.88rem;color:var(--ink-2);font-weight:700}
.eg .n{font-family:var(--f-num);font-weight:700;font-size:1.15rem}
.eg .n small{font-size:.85rem;color:var(--ink-2);font-family:var(--f-body)}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.95rem;border-radius:999px;padding:2px 10px}
.status.ok{background:var(--ok-soft);color:var(--ok)}
.status.ng{background:var(--red-soft);color:var(--red-ink)}

/* game log */
.days{display:flex;flex-direction:column;gap:2px}
.day{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--rule)}
.day:first-child{border-top:0}
.day .d{font-family:var(--f-num);font-size:.95rem;color:var(--ink-2)}
.gs{display:flex;flex-wrap:wrap;gap:5px}
.g{width:26px;height:30px;border:1.5px solid var(--line);border-radius:6px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:.85rem;background:var(--face)}
.g.p1{background:var(--red);border-color:var(--red);color:#fff}
.g.p4{color:var(--ink-3);border-style:dashed}
.more{margin-top:12px;width:100%;background:none;border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:1rem;font-weight:700;color:var(--ink-2);cursor:pointer}

/* ---------- rankings ---------- */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seg button{border:1.5px solid var(--line);background:var(--face);border-radius:12px;padding:12px 6px;font-family:var(--f-disp);font-weight:700;font-size:1.05rem;line-height:1.3;cursor:pointer;min-height:52px}
.seg button:first-child{grid-column:1/-1}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.seg button[aria-pressed="true"]::before{content:"✓ ";color:var(--red)}
.note{font-size:.95rem;color:var(--ink-2);margin:0 0 14px;line-height:1.6}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin:6px 0 20px}
.pod{text-align:center;min-width:0}
.pod .t{border:1.5px solid var(--line);border-radius:14px;background:var(--face);box-shadow:0 5px 0 -1.5px var(--red),0 5px 0 0 var(--line);padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px}
.pod.p1 .t{padding-block:18px 14px}
.pod .medal{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;color:#fff;font-size:.95rem}
.pod .nm{font-family:var(--f-disp);font-weight:900;font-size:1rem;line-height:1.25;word-break:break-all}
.pod.p1 .nm{font-size:1.2rem}
.pod .val{font-family:var(--f-num);font-weight:700;font-size:1rem;color:var(--ink-2)}
.pod.me .t{background:var(--red-soft)}
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 10px;border-radius:10px}
.row+.row{border-top:1px solid var(--rule)}
.row .rk{font-family:var(--f-num);font-weight:700;font-size:1.15rem;color:var(--ink-2);text-align:center}
.row.aw .rk{color:var(--red-ink)}
.row .nm{font-weight:700;font-size:1.1rem;min-width:0;overflow-wrap:anywhere}
.row .nm small{display:block;font-weight:400;font-size:.85rem;color:var(--ink-2)}
.row .val{font-family:var(--f-num);font-weight:700;font-size:1.1rem;text-align:right}
.row .val small{display:block;font-weight:500;font-size:.82rem;color:var(--ink-2)}
.row.me{background:var(--red-soft);border-top-color:transparent}
.row.me+.row{border-top-color:transparent}
.row.me .nm::after{content:"あなた";margin-left:6px;font-size:.78rem;background:var(--red);color:#fff;border-radius:4px;padding:0 5px;vertical-align:2px}
.cut{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--red-ink);font-weight:700;margin:6px 0}
.cut::before,.cut::after{content:"";flex:1;border-top:1.5px dashed var(--red)}
.jump{margin-top:10px;width:100%;background:none;border:1.5px solid var(--line);border-radius:10px;padding:8px;font-weight:700;cursor:pointer}

/* ---------- records ---------- */
.hist{list-style:none;margin:0;padding:0}
.hist li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--rule)}
.hist li:first-child{border-top:0}
.hist .p{font-size:.9rem;color:var(--ink-2)}
.hist .n{font-weight:700}
.hist .v{font-family:var(--f-num);font-weight:700}
.hist li.latest .n{color:var(--red-ink)}
.yk-sum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.yk-sum .pill b{font-family:var(--f-num)}
.yk{list-style:none;margin:0;padding:0}
.yk li{display:grid;grid-template-columns:96px 1fr auto;gap:10px;padding:7px 0;border-top:1px solid var(--rule);align-items:baseline}
.yk li:first-child{border-top:0}
.yk .d{font-family:var(--f-num);font-size:.88rem;color:var(--ink-2)}
.yk .n{font-weight:700}
.yk .h{font-family:var(--f-disp);font-weight:700;color:var(--red-ink);font-size:1rem}

/* ---------- rules ---------- */
.rules dl{margin:0;display:grid;gap:14px}
.rules dt{font-family:var(--f-disp);font-weight:700;font-size:1.1rem;margin-bottom:2px}
.rules dd{margin:0;font-size:1rem;line-height:1.75;color:var(--ink-2)}
.ptrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.ptrow div{border:1.5px solid var(--line);border-radius:8px;text-align:center;padding:4px 0;background:var(--face)}
.ptrow b{display:block;font-family:var(--f-disp);font-size:.88rem;color:var(--ink-2)}
.ptrow span{font-family:var(--f-num);font-weight:700;color:var(--ink)}

/* ---------- tab bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1.5px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabs button{background:none;border:0;border-radius:12px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-disp);font-weight:700;font-size:.85rem;color:var(--ink-2);cursor:pointer}
.tabs button .ic{width:26px;height:30px;border:1.5px solid currentColor;border-radius:6px;display:grid;place-items:center;font-size:.85rem;font-weight:900;box-shadow:0 3px 0 -1.5px transparent}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] .ic{background:var(--face);border-color:var(--line);color:var(--red);box-shadow:0 3px 0 -1.5px var(--red),0 3px 0 0 var(--line)}

.empty{padding:28px 8px;text-align:center;color:var(--ink-2)}
.privnote{background:var(--ok-soft);color:var(--ink);border:1.5px solid var(--ok);border-radius:12px;padding:12px 14px;font-size:.95rem;line-height:1.6}
.privnote b{display:block;color:var(--ok);font-family:var(--f-disp);font-size:1.05rem;margin-bottom:2px}
/* loading */
.wait{padding:34px 18px 30px;text-align:center}
.wait .tiles{display:flex;justify-content:center;gap:10px;margin-bottom:22px}
.wait .tiles span{width:38px;height:48px;border:1.5px solid var(--line);border-radius:8px;background:var(--face);box-shadow:0 4px 0 -1.5px var(--red),0 4px 0 0 var(--line);display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:1.3rem;color:var(--red)}
@media (prefers-reduced-motion:no-preference){
  .wait .tiles span{animation:hop 1.2s ease-in-out infinite}
  .wait .tiles span:nth-child(2){animation-delay:.15s}
  .wait .tiles span:nth-child(3){animation-delay:.3s}
  .wait .tiles span:nth-child(4){animation-delay:.45s}
  @keyframes hop{0%,60%,100%{transform:none}30%{transform:translateY(-10px)}}
}
.wait .msg{font-family:var(--f-disp);font-weight:900;font-size:1.3rem;line-height:1.5;margin:0}
.wait .sub{margin:10px 0 0;font-size:1rem;color:var(--ink-2);line-height:1.7}
.wait .sub b{color:var(--red-ink)}
.retry{margin-top:20px;background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px 28px;font-family:var(--f-disp);font-weight:900;font-size:1.15rem;cursor:pointer;box-shadow:0 4px 0 0 var(--red-ink)}
.banner{display:flex;align-items:center;gap:10px;background:var(--red-soft);color:var(--red-ink);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:700;font-size:.95rem}
.banner .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
@media (prefers-reduced-motion:no-preference){.banner .dot{animation:blink 1s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}}
.loading .tile{min-height:120px}
.err{color:var(--red-ink);font-weight:700}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .25s ease-out}
  @keyframes in{from{transform:translateY(4px)}to{transform:none}}
}
@media (max-width:360px){.hero .big{font-size:2.2rem}.grid4{gap:10px}.stat .v{font-size:1.3rem}}
</style>
</head>

<script>
(function(){
/* ▼ GASをデプロイしたときに表示される「ウェブアプリのURL」をここに貼ってください ▼ */
const API_URL = 'https://script.google.com/macros/s/AKfycbylpC2D0GUTBvDacJXvBoaFEgAeZflxNlSwnTk9UZCRw11PH8Z1UuOfjA5GH9shkGahHA/exec';
/* ▲ ここまで ▲ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// 本人専用リンク（?k=合言葉）。一度開けばこの端末が覚える
let KEY='';
try{const q=new URLSearchParams(location.search).get('k'); if(q){KEY=q.trim(); store.set('jao.key',KEY)} else {KEY=store.get('jao.key')||''}}catch(e){}
let D=null, tab=(location.hash||'').replace('#','')||'me', me=store.get('jao.me')||'', cat='rate', logAll=false, listAll=false;
let MIN_TOTAL=50, MIN_MONTH=10, MONTHS=['1か月目','2か月目','3か月目'];
// 最終対局日の月が、期の何か月目か（0〜2）
function currentMonthIndex(){
  const m=D&&D.lastDate?Number(D.lastDate.split('/')[1]):NaN;
  const i=MONTHS.findIndex(x=>parseInt(x,10)===m);
  return i<0?2:i;
}

const fmt={
  rate:v=>v==null?'—':v.toFixed(1),
  avg:v=>v==null?'—':v.toFixed(3),
  pts:v=>v==null?'—':Math.round(v).toLocaleString('ja-JP'),
  pct:v=>v==null?'—':(v*100).toFixed(2)+'%',
  int:v=>v==null?'—':String(Math.round(v))
};
const CATS={
  rate:{label:'レーティング',val:p=>p.rate,rank:p=>p.rateRank,f:fmt.rate,unit:'',all:true,note:'参加者全員が対象（ゲーム数の条件なし）'},
  wins:{label:'勝利数賞',val:p=>p.wins,rank:p=>p.aw&&p.aw.wins,f:fmt.int,unit:'勝',note:'ゲーム数の基準を満たした人のみ。同数はレーティング上位が上'},
  avgRank:{label:'平均順位賞',val:p=>p.avgRank,rank:p=>p.aw&&p.aw.avgRank,f:fmt.avg,unit:'着',note:'ゲーム数の基準を満たした人のみ。小さいほど上位'},
  avgPts:{label:'平均持点賞',val:p=>p.avgPts,rank:p=>p.aw&&p.aw.avgPts,f:fmt.pts,unit:'点',note:'ゲーム数の基準を満たした人のみ'},
  avoid:{label:'4着回避率賞',val:p=>p.avoid,rank:p=>p.aw&&p.aw.avoid,f:fmt.pct,unit:'',note:'ゲーム数の基準を満たした人のみ。4着にならなかった割合'}
};

function active(){return D.players.filter(p=>p.g>0&&p.rate!=null)}
function isMine(p){return !!(D&&D.mine&&p&&p.name===D.mine.name)}
function canOpen(p){return !!p&&p.rate!=null&&(!p.private||isMine(p))}
function player(n){return D.players.find(p=>p.name===n)}

function setTab(t){
  tab=t; listAll=false;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t?'true':'false'));
  render(); window.scrollTo(0,0);
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

function picker(){
  const ps=active().filter(canOpen).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  return `<div class="picker"><label for="who">氏名</label><div class="sel"><select id="who">
    <option value="">選んでください</option>
    ${ps.map(p=>`<option value="${esc(p.name)}" ${p.name===me?'selected':''}>${esc(p.name)}</option>`).join('')}
  </select></div></div>`;
}
function bindPicker(){
  const s=$('#who'); if(!s) return;
  s.addEventListener('change',()=>{me=s.value;store.set('jao.me',me);logAll=false;render()});
}

function spark(series){
  if(!series||series.length<2) return '';
  const W=320,H=92,pl=34,pr=8,pt=8,pb=16;
  const lo=Math.min(1500,...series),hi=Math.max(1500,...series);
  const pad=(hi-lo)*.08||10, y0=lo-pad, y1=hi+pad;
  const X=i=>pl+(W-pl-pr)*i/(series.length-1), Y=v=>pt+(H-pt-pb)*(1-(v-y0)/(y1-y0));
  const pts=series.map((v,i)=>[X(i),Y(v)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=d+` L${X(series.length-1).toFixed(1)} ${H-pb} L${pl} ${H-pb} Z`;
  const last=pts[pts.length-1], yb=Y(1500);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="レーティング推移">
    <path d="${area}" fill="var(--red-soft)"/>
    <line x1="${pl}" x2="${W-pr}" y1="${yb}" y2="${yb}" stroke="var(--ink-3)" stroke-dasharray="3 3" stroke-width="1"/>
    <text x="${pl-4}" y="${yb+3}" text-anchor="end">1500</text>
    <text x="${pl-4}" y="${Y(hi)+3}" text-anchor="end">${Math.round(hi)}</text>
    ${lo<1500-1&&Math.abs(Y(lo)-yb)>12?`<text x="${pl-4}" y="${Y(lo)+3}" text-anchor="end">${Math.round(lo)}</text>`:''}
    <path d="${d}" fill="none" stroke="var(--red)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="4" fill="var(--face)" stroke="var(--red)" stroke-width="2"/>
    <text x="${pl}" y="${H-3}">1G</text><text x="${W-pr}" y="${H-3}" text-anchor="end">${series.length}G</text>
  </svg>`;
}

function deltaHtml(cur,prev,better,f){
  if(cur==null||prev==null) return '';
  const d=cur-prev; if(Math.abs(d)<1e-9) return '<span class="delta">±0</span>';
  const good=better==='high'?d>0:d<0;
  return `<span class="delta ${good?'up':'down'}">${d>0?'+':'−'}${f(Math.abs(d))}</span>`;
}

function viewMe(){
  let h=picker();
  const p=player(me);
  if(!canOpen(p)){
    return h+`<div class="tile empty">上のリストから自分の名前を選ぶと、今期の成績が表示されます。<br>選んだ名前はこの端末に記憶されます。</div>`;
  }
  const pv=p.prev||{};
  const months=p.months||[0,0,0];
  const curM=currentMonthIndex();
  const okTotal=p.g>=MIN_TOTAL, okMonth=months.map(m=>m>=MIN_MONTH);
  const okPast=okMonth.every((v,i)=>i>curM||v);
  const ok=okTotal&&okMonth.every(Boolean);
  const need=Math.max(0,MIN_TOTAL-p.g);
  const statusText=ok?'表彰基準クリア':(!okPast?'月のゲーム数が不足':'あと'+need+'ゲーム');
  const rk=(r,a)=>`<div class="rk"><span class="pill">全体 ${r??'—'}位</span>${a?`<span class="pill ${a<=4?'top':'aw'}">表彰 ${a}位</span>`:''}</div>`;
  const tot=p.places.reduce((a,b)=>a+b,0)||1;
  const cols=['var(--red)','var(--ink-2)','var(--ink-3)','var(--rule)'];

  h+=`<div class="stack view">
  ${isMine(p)?`<div class="privnote"><b>🔒 あなた専用の表示です</b>この成績は、あなたの専用リンクで開いたときだけ見られます。リンクは他の人に送らないでください。</div>`:''}
  <section class="tile" aria-label="レーティング">
    <div class="hero">
      <div><div class="lbl">レーティング</div><div class="big">${fmt.rate(p.rate)}</div></div>
      <div class="rank"><div class="lbl">順位</div><span class="rankchip"><b>${p.rateRank}</b>位</span></div>
      <div class="sub"><span>${p.g}ゲーム</span>${pv.rate!=null?`<span>前期 <span class="num">${fmt.rate(pv.rate)}</span>（${pv.rateRank??'—'}位）</span>`:''}</div>
    </div>
    ${spark(p.series)}
  </section>

  <section>
    <div class="grid4">
      <div class="stat"><h3>勝利数（1着）</h3><div class="v">${p.wins}<small>勝</small></div>${rk(p.winsRank,p.aw.wins)}<div class="pv">前期 ${fmt.int(pv.wins)}勝</div></div>
      <div class="stat"><h3>平均着順</h3><div class="v">${fmt.avg(p.avgRank)}<small>着</small></div>${rk(p.avgRankRank,p.aw.avgRank)}<div class="pv">前期 ${fmt.avg(pv.avgRank)} ${deltaHtml(p.avgRank,pv.avgRank,'low',v=>v.toFixed(3))}</div></div>
      <div class="stat"><h3>平均持点</h3><div class="v">${fmt.pts(p.avgPts)}<small>点</small></div>${rk(p.avgPtsRank,p.aw.avgPts)}<div class="pv">前期 ${fmt.pts(pv.avgPts)}</div></div>
      <div class="stat"><h3>4着回避率</h3><div class="v">${fmt.pct(p.avoid)}</div>${rk(p.avoidRank,p.aw.avoid)}<div class="pv">前期 ${fmt.pct(pv.avoid)}</div></div>
    </div>
  </section>

  <section class="tile">
    <div class="sec-t"><h2>着順の内訳</h2><small>前期と比べて</small></div>
    <div class="places">
      ${p.places.map((c,i)=>`<div class="pl"><div class="t">${i+1}着</div><div class="c num">${c}回</div><div class="r">${(c/tot*100).toFixed(1)}%<br>前期 ${pv.places?fmt.int(pv.places[i]):'—'}回</div></div>`).join('')}
    </div>
    <div class="pbar" aria-hidden="true">${p.places.map((c,i)=>`<span style="width:${c/tot*100}%;background:${cols[i]}"></span>`).join('')}</div>
  </section>

  <section class="tile">
    <div class="sec-t"><h2>表彰の条件</h2><span class="status ${ok?'ok':'ng'}">${statusText}</span></div>
    <div class="elig">
      <div class="eg ${okTotal?'ok':''}"><div class="k">期合計</div><div class="n">${p.g}<small>/${MIN_TOTAL}</small></div></div>
      ${MONTHS.map((m,i)=>i>curM?`<div class="eg future"><div class="k">${m}</div><div class="n"><small>これから</small></div></div>`:`<div class="eg ${okMonth[i]?'ok':''}"><div class="k">${m}</div><div class="n">${months[i]}<small>/${MIN_MONTH}</small></div></div>`).join('')}
    </div>
    <p class="note" style="margin:10px 0 0">期に${MIN_TOTAL}ゲーム以上、かつ毎月${MIN_MONTH}ゲーム以上で表彰対象になります。</p>
  </section>

  ${logSection(p)}
  </div>`;
  return h;
}

function logSection(p){
  if(!p.log||!p.log.length) return '';
  const byDay=[]; p.log.forEach(([d,s,pl])=>{let x=byDay[byDay.length-1]; if(!x||x.d!==d){x={d,g:[]};byDay.push(x)} x.g.push([s,pl])});
  byDay.reverse();
  const show=logAll?byDay:byDay.slice(0,6);
  return `<section class="tile">
    <div class="sec-t"><h2>対局の記録</h2><small>新しい順 · ${byDay.length}日</small></div>
    <div class="days">${show.map(x=>`<div class="day"><div class="d">${x.d}</div><div class="gs">${x.g.map(([s,pl])=>`<span class="g p${Math.floor(pl)}" title="${s.toLocaleString('ja-JP')}点">${Number.isInteger(pl)?pl:pl.toFixed(1)}</span>`).join('')}</div></div>`).join('')}</div>
    ${byDay.length>6?`<button class="more" id="more">${logAll?'閉じる':'すべて表示（'+byDay.length+'日）'}</button>`:''}
  </section>`;
}

function viewRank(){
  const c=CATS[cat];
  let ps=active().filter(p=>c.rank(p)!=null).sort((a,b)=>c.rank(a)-c.rank(b));
  const top=ps.slice(0,3);
  const order=[top[1],top[0],top[2]].filter(Boolean);
  const meIdx=ps.findIndex(p=>p.name===me);
  const LIMIT=20;
  const rest=listAll?ps:ps.slice(0,LIMIT);
  const medal=['var(--gold)','var(--silver)','var(--bronze)'];
  let h=`<div class="view"><div class="seg" role="group" aria-label="部門">${Object.entries(CATS).map(([k,v])=>`<button data-cat="${k}" aria-pressed="${k===cat}">${v.label}</button>`).join('')}</div>
  <p class="note">${c.note}</p>`;
  if(!ps.length) return h+`<div class="tile empty">まだ該当者がいません。</div></div>`;
  h+=`<div class="podium">${order.map(p=>{const r=c.rank(p);return `<div class="pod p${r} ${p.name===me?'me':''}"><div class="t"><span class="medal" style="background:${medal[r-1]||'var(--ink-3)'}">${r}</span><span class="nm">${esc(p.name)}</span><span class="val">${c.f(c.val(p))}${c.unit}</span></div></div>`}).join('')}</div>`;
  h+=`<section class="tile" style="padding:8px"><ol class="list">`;
  rest.forEach((p,i)=>{
    const r=c.rank(p);
    if(!c.all && i>0 && c.rank(rest[i-1])<=4 && r>4) h+=`<li class="cut">ここまで表彰</li>`;
    const sub=cat==='rate'?(p.prev&&p.prev.rate!=null?`前期 ${fmt.rate(p.prev.rate)}`:'前期なし'):`${p.g}ゲーム`;
    h+=`<li class="row ${!c.all&&r<=4?'aw':''} ${p.name===me?'me':''}" ${p.name===me?'id="merow"':''}><span class="rk">${r}</span><span class="nm">${esc(p.name)}<small>${sub}</small></span><span class="val">${c.f(c.val(p))}${c.unit}<small>${cat==='rate'?p.g+'G':''}</small></span></li>`;
  });
  h+=`</ol>`;
  if(ps.length>LIMIT) h+=`<button class="more" id="listall">${listAll?'上位'+LIMIT+'人だけ表示':'全'+ps.length+'人を表示'}</button>`;
  h+=`</section>`;
  if(meIdx>=LIMIT&&!listAll){const p=ps[meIdx];h+=`<section class="tile" style="padding:8px;margin-top:14px"><ol class="list"><li class="row me"><span class="rk">${c.rank(p)}</span><span class="nm">${esc(p.name)}<small>${p.g}ゲーム</small></span><span class="val">${c.f(c.val(p))}</span></li></ol></section>`}
  else if(me&&meIdx<0&&!c.all){h+=`<p class="note" style="margin-top:12px">${esc(me)} さんは、まだゲーム数の基準に届いていないため、この部門には載っていません。</p>`}
  return h+`</div>`;
}

function viewRec(){
  const hist=D.history.slice().reverse();
  const yk=D.yakuman.slice().reverse();
  const cnt={}; D.yakuman.forEach(y=>cnt[y[2]]=(cnt[y[2]]||0)+1);
  const kinds=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  const showYk=listAll?yk:yk.slice(0,15);
  return `<div class="stack view">
  <section class="tile">
    <div class="sec-t"><h2>歴代レーティング1位</h2><small>${D.history.length}期</small></div>
    <ul class="hist">${hist.map((x,i)=>`<li class="${i===0?'latest':''}"><span class="p">${esc(x[2])}</span><span class="n">${esc(x[0])}</span><span class="v">${fmt.rate(x[1])}</span></li>`).join('')}</ul>
  </section>
  <section class="tile">
    <div class="sec-t"><h2>役満の記録</h2><small>全${D.yakuman.length}回</small></div>
    <div class="yk-sum">${kinds.map(([k,n])=>`<span class="pill">${esc(k)} <b>${n}</b></span>`).join('')}</div>
    <ul class="yk">${showYk.map(y=>`<li><span class="d">${esc(y[0])}</span><span class="n">${esc(y[1])}</span><span class="h">${esc(y[2])}</span></li>`).join('')}</ul>
    ${yk.length>15?`<button class="more" id="listall">${listAll?'閉じる':'すべて表示（'+yk.length+'回）'}</button>`:''}
  </section></div>`;
}

function viewRule(){
  return `<section class="tile rules view"><dl>
  <div><dt>表彰の対象</dt><dd>期の規定打荘数${MIN_TOTAL}ゲーム以上、かつ毎月${MIN_MONTH}ゲーム以上。勝利数・平均順位・平均持点・4着回避率の各部門で、上位4名を表彰します。</dd></div>
  <div><dt>レーティング</dt><dd>1500から始まり、1ゲームごとに順位点と得失点を足します。表彰条件に関係なく全員が順位に載ります。
    <div class="ptrow"><div><b>1着</b><span>+30</span></div><div><b>2着</b><span>+10</span></div><div><b>3着</b><span>−10</span></div><div><b>4着</b><span>−20</span></div></div>
    得失点は35,000点を基準に1,000点＝0.1R。<br>例）40,500点で1着 → +30（1着）＋0.55（浮き5,500点）＝ +30.55</dd></div>
  <div><dt>同点・同着</dt><dd>1着2着が同点なら1.5着、2着3着は2.5着、3着4着は3.5着。レーティングの順位点は折半します。</dd></div>
  <div><dt>同順位</dt><dd>各部門で同じ値のときは、レーティングが高い方が上位です。</dd></div>
  <div><dt>名前の表示</dt><dd>このアプリにはニックネームだけを表示しています。「本人のみ開示」の方はランキングには載りますが、詳しい成績はご本人の専用リンクでだけ見られます。</dd></div>
  </dl></section>`;
}

function render(){
  if(!D) return;
  const m=$('#main');
  m.innerHTML = tab==='rank'?viewRank():tab==='rec'?viewRec():tab==='rule'?viewRule():viewMe();
  bindPicker();
  m.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{cat=b.dataset.cat;listAll=false;render()}));
  const mo=$('#more'); if(mo) mo.addEventListener('click',()=>{logAll=!logAll;render()});
  const la=$('#listall'); if(la) la.addEventListener('click',()=>{listAll=!listAll;render()});
}

const CACHE_KEY='jao.data';
let slowTimer=null;
function applyData(d){
  if(d.mine){
    const i=d.players.findIndex(p=>p.name===d.mine.name);
    if(i>=0) d.players[i]=d.mine; else d.players.push(d.mine);
    if(!me||!d.players.some(p=>p.name===me&&(!p.private||p.name===d.mine.name))){me=d.mine.name;store.set('jao.me',me)}
  }
  D=d;
  MIN_MONTH=d.minMonth||MIN_MONTH;
  if(d.monthLabels&&d.monthLabels.length===3) MONTHS=d.monthLabels;
  $('#period').textContent=d.period;
  $('#meta').innerHTML=`<span>最終対局 <span class="num">${esc(d.lastDate||'—')}</span></span><span>更新 <span class="num">${esc(d.updated)}</span></span>`;
  if(!['me','rank','rec','rule'].includes(tab)) tab='me';
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));
  render();
}
function showWaitSlow(){
  const sub=document.querySelector('.wait .sub');
  if(sub) sub.innerHTML='まだ読み込んでいます。<br>もう少しだけお待ちください。';
  const bt=$('#bannerText'); if(bt) bt.textContent='最新の成績を確認しています。もう少しお待ちください…';
}
function showError(){
  if(D){
    $('#banner').hidden=false;
    $('#bannerText').textContent='最新の成績を読み込めませんでした。前回の成績を表示しています。右上の「更新」で読み直せます。';
    $('#banner').querySelector('.dot').hidden=true;
    return;
  }
  $('#main').innerHTML=`<section class="tile wait">
    <p class="msg">成績を読み込めませんでした</p>
    <p class="sub">電波の良いところで、<br>下のボタンを押してください。</p>
    <button class="retry" id="retry">もう一度読み込む</button>
  </section>`;
  $('#retry').addEventListener('click',()=>{
    $('#main').innerHTML=`<section class="tile wait"><div class="tiles" aria-hidden="true"><span>じ</span><span>ゃ</span><span>お</span><span>と</span></div><p class="msg">成績を読み込んでいます</p><p class="sub">このままお待ちください。</p></section>`;
    load();
  });
}
function load(){
  const btn=$('#reload'); btn.setAttribute('aria-busy','true');
  if(D){ $('#banner').hidden=false; $('#banner').querySelector('.dot').hidden=false; $('#bannerText').textContent='最新の成績を確認しています…'; }
  clearTimeout(slowTimer); slowTimer=setTimeout(showWaitSlow,8000);
  const url=API_URL?API_URL+(API_URL.includes('?')?'&':'?')+'t='+Date.now()+(KEY?'&k='+encodeURIComponent(KEY):''):'data.json';
  fetch(url,{cache:'no-store'}).then(r=>{if(!r.ok) throw new Error(r.status);return r.json()}).then(d=>{
    if(d.error) throw new Error(d.error);
    applyData(d);
    $('#banner').hidden=true;
    if(d.keyError){
      KEY=''; try{localStorage.removeItem('jao.key')}catch(e){}
      $('#banner').hidden=false; $('#banner').querySelector('.dot').hidden=true;
      $('#bannerText').textContent='この専用リンクは使えなくなりました。新しいリンクはお店にお問い合わせください。';
    }
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(d))}catch(e){}
  }).catch(()=>showError())
  .finally(()=>{clearTimeout(slowTimer);btn.setAttribute('aria-busy','false')});
}
// 前回の成績があれば、すぐに表示してから最新を読み込む
try{const c=localStorage.getItem(CACHE_KEY); if(c){applyData(JSON.parse(c))}}catch(e){}
$('#reload').addEventListener('click',load);
let lastLoad=Date.now();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&D&&Date.now()-lastLoad>60000){lastLoad=Date.now();load()}});
load();
})();
</script>
</body>
</html>
